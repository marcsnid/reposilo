<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}reposilo{% endblock %}</title>
  <script>
    (function () {
      try {
        var t = localStorage.getItem('rs-theme');
        if (!t) { t = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'; }
        document.documentElement.dataset.theme = t;
        var v = localStorage.getItem('rs-view');
        document.documentElement.dataset.view = v === 'list' ? 'list' : 'grid';
      } catch (e) {}
    })();
    function toggleTheme() {
      var d = document.documentElement;
      var n = d.dataset.theme === 'dark' ? 'light' : 'dark';
      d.dataset.theme = n;
      try { localStorage.setItem('rs-theme', n); } catch (e) {}
    }
    function setView(v) {
      v = v === 'list' ? 'list' : 'grid';
      document.documentElement.dataset.view = v;
      try { localStorage.setItem('rs-view', v); } catch (e) {}
      syncViewButtons();
    }
    function syncViewButtons() {
      var v = document.documentElement.dataset.view === 'list' ? 'list' : 'grid';
      var btns = document.querySelectorAll('.view-btn');
      for (var i = 0; i < btns.length; i++) {
        btns[i].classList.toggle('active', btns[i].dataset.view === v);
      }
    }
    // sidebar folders: remember which parents are collapsed, hide descendants
    function collapsedFolders() {
      try { return new Set(JSON.parse(localStorage.getItem('rs-collapsed-folders') || '[]')); }
      catch (e) { return new Set(); }
    }
    function saveCollapsedFolders(set) {
      try { localStorage.setItem('rs-collapsed-folders', JSON.stringify(Array.from(set))); } catch (e) {}
    }
    function applyFolderCollapse() {
      var set = collapsedFolders();
      var changed = false;
      // keep the active folder visible by expanding its ancestors
      var active = document.querySelector('.folders li a.active');
      var activeLi = active && active.closest('li');
      var activeRel = activeLi && activeLi.dataset.folder;
      if (activeRel) {
        var parts = activeRel.split('/');
        var prefix = '';
        for (var i = 0; i < parts.length - 1; i++) {
          prefix = prefix ? prefix + '/' + parts[i] : parts[i];
          if (set.delete(prefix)) changed = true;
        }
        if (changed) saveCollapsedFolders(set);
      }
      var lis = Array.prototype.slice.call(document.querySelectorAll('.folders li[data-folder]'));
      lis.forEach(function (li) { li.classList.remove('collapsed', 'folder-hidden'); });
      lis.forEach(function (li) {
        var rel = li.dataset.folder;
        if (!rel || !set.has(rel)) return;
        li.classList.add('collapsed');
        lis.forEach(function (other) {
          var orel = other.dataset.folder;
          if (orel && orel.indexOf(rel + '/') === 0) other.classList.add('folder-hidden');
        });
      });
      Array.prototype.forEach.call(document.querySelectorAll('.fcollapse'), function (btn) {
        var li = btn.closest('li');
        var collapsed = !!(li && li.classList.contains('collapsed'));
        btn.setAttribute('aria-expanded', collapsed ? 'false' : 'true');
        btn.innerHTML = collapsed ? '&#9656;' : '&#9662;';
      });
    }
    function toggleFolder(ev) {
      ev.preventDefault();
      ev.stopPropagation();
      var li = ev.currentTarget.closest('li');
      if (!li) return;
      var rel = li.dataset.folder;
      if (!rel) return;
      var set = collapsedFolders();
      if (set.has(rel)) { set.delete(rel); } else { set.add(rel); }
      saveCollapsedFolders(set);
      applyFolderCollapse();
    }
    // The add-repo form lives in the top bar, so it has no server context.
    // Mirror the active folder/tag filters into it only when the URL actually
    // changes (or the panel is opened), so a periodic htmx swap cannot wipe
    // input the user is still typing.
    var lastSyncedSearch = null;
    function syncAddForm(force) {
      var search = window.location.search || '';
      if (!force && search === lastSyncedSearch) return;
      lastSyncedSearch = search;
      var form = document.querySelector('.add-panel form');
      if (!form) return;
      var p = new URLSearchParams(search);
      var folder = form.querySelector('#add-folder');
      var tags = form.querySelector('#add-tags');
      if (folder && document.activeElement !== folder) folder.value = p.get('folder') || '';
      if (tags && document.activeElement !== tags) tags.value = p.get('tags') || '';
    }
    // Keep an icon field to a single visible character (emoji are graphemes
    // made of several code points, so this uses Intl.Segmenter when present).
    function oneGrapheme(s) {
      try {
        if (window.Intl && Intl.Segmenter) {
          var seg = new Intl.Segmenter(undefined, { granularity: 'grapheme' });
          var first = seg.segment(s)[Symbol.iterator]().next().value;
          return first ? first.segment : '';
        }
      } catch (e) {}
      var chars = Array.from(s);
      var out = chars[0] || '';
      if (chars[1] && /[\uFE0E\uFE0F\u20E3]/.test(chars[1])) { out += chars[1]; }
      return out;
    }
    // drag-and-drop: repo cards onto sidebar folders
    function dragRepo(ev) {
      ev.dataTransfer.setData('text/reposilo-rel', ev.currentTarget.dataset.rel);
      ev.dataTransfer.effectAllowed = 'move';
    }
    function dragOverFolder(ev) {
      ev.preventDefault();
      ev.currentTarget.classList.add('dragover');
    }
    function dragLeaveFolder(ev) {
      ev.currentTarget.classList.remove('dragover');
    }
    function dropRepo(ev) {
      ev.preventDefault();
      ev.currentTarget.classList.remove('dragover');
      var rel = ev.dataTransfer.getData('text/reposilo-rel');
      if (!rel) return;
      htmx.ajax('POST', '/repos/move', {
        target: '#toast',
        swap: 'innerHTML',
        values: { rel: rel, folder: ev.currentTarget.dataset.folder || '' }
      });
    }
    // bulk selection: checkboxes across the repo grid drive the bulk bar
    function selectedRepos() {
      return Array.prototype.map.call(document.querySelectorAll('.bulk-check:checked'), function (c) { return c.value; });
    }
    function updateBulkBar() {
      var checks = document.querySelectorAll('.bulk-check');
      var selected = document.querySelectorAll('.bulk-check:checked').length;
      var bar = document.getElementById('bulk-bar');
      if (bar) bar.classList.toggle('active', selected > 0);
      var count = document.getElementById('bulk-count');
      if (count) count.textContent = selected + ' selected';
      var all = document.getElementById('bulk-all');
      if (all) {
        all.checked = selected > 0 && selected === checks.length;
        all.indeterminate = selected > 0 && selected < checks.length;
      }
    }
    function toggleAllChecks(on) {
      Array.prototype.forEach.call(document.querySelectorAll('.bulk-check'), function (c) { c.checked = on; });
      updateBulkBar();
    }
  </script>
  <link rel="stylesheet" href="/assets/style.css">
  <script src="/assets/htmx.min.js" defer></script>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/"><svg class="icon brand-icon" viewBox="0 0 16 16"><path d="M2 2h12v3H2z"/><rect x="2" y="7" width="12" height="3"/><path d="M2 12h12v2H2z"/><path d="M7 3h2v1H7zM7 8h2v1H7z"/></svg> <b>reposilo</b></a>
    <div class="topbar-actions">
      <details class="add-menu" ontoggle="if(this.open) syncAddForm(true)">
        <summary>&#xFF0B; Add repo</summary>
        <div class="add-panel">
          <h4>Add repository</h4>
          <form hx-post="/repos/add" hx-target="#toast" hx-swap="innerHTML" hx-indicator="find .spinner"
                hx-on::after-request="this.reset(); this.closest('details').open = false">
            <label for="add-url">Repository URL</label>
            <input id="add-url" name="url" type="url" placeholder="https://github.com/owner/repo.git" required>
            <label for="add-tags">Tags</label>
            <input id="add-tags" name="tags" placeholder="comma separated (optional)">
            <label for="add-folder">Folder</label>
            <input id="add-folder" name="folder" list="add-folder-list" placeholder="e.g. tools/rust (optional)">
            <datalist id="add-folder-list" hx-get="/folders/options" hx-trigger="load" hx-target="this" hx-swap="innerHTML"></datalist>
            <button type="submit"><span class="spinner htmx-indicator"></span>Archive</button>
          </form>
        </div>
      </details>
      <button class="theme-toggle" onclick="toggleTheme()" title="toggle theme" aria-label="toggle theme">
        <svg class="icon" viewBox="0 0 16 16"><circle cx="8" cy="8" r="6"/><path d="M8 2a6 6 0 0 0 0 12Z" fill="currentColor" stroke="none"/></svg>
      </button>
      <a class="icon-btn" id="bell" href="/notifications" title="notifications">
        <svg class="icon" viewBox="0 0 16 16"><path d="M8 1a4.5 4.5 0 0 0-4.5 4.5c0 4-1.5 5.5-1.5 5.5h12s-1.5-1.5-1.5-5.5A4.5 4.5 0 0 0 8 1Z"/><path d="M6.5 13.5a1.5 1.5 0 0 0 3 0"/></svg>
        <span class="bell-count" id="bell-count" hx-get="/api/bell" hx-trigger="load, every 60s" hx-swap="innerHTML"></span>
      </a>
      <a class="icon-btn" href="/stats" title="Stats" aria-label="Stats">
        <svg class="icon" viewBox="0 0 16 16"><path d="M2 14V2M2 14h12"/><rect x="4" y="8" width="2" height="4"/><rect x="8" y="5" width="2" height="7"/><rect x="12" y="9" width="2" height="3"/></svg>
      </a>
      <a class="icon-btn" href="/settings" title="Settings" aria-label="Settings">
        <svg class="icon" viewBox="0 0 16 16"><path d="M1.5 4h13M1.5 8h13M1.5 12h13"/><circle cx="5" cy="4" r="2"/><circle cx="11" cy="8" r="2"/><circle cx="6" cy="12" r="2"/></svg>
      </a>
    </div>
  </header>
  <div id="toast"></div>
  <div id="modal-root"></div>
  <script>
    // Status messages land in the fixed #toast area at the bottom of the
    // viewport and fade out once the job is done. htmx swaps fragments in
    // asynchronously, so always scan the live #toast after a swap (an
    // outerHTML poll replaces the element, so the event target is stale).
    (function () {
      function dismiss(el) {
        if (!el || el.dataset.toastDismissed) return;
        el.dataset.toastDismissed = '1';
        el.classList.add('toast-out');
        setTimeout(function () { el.remove(); }, 450);
      }
      function schedule() {
        var toast = document.getElementById('toast');
        if (!toast) return;
        Array.prototype.forEach.call(toast.children, function (n) {
          if (n.dataset.toastScheduled) return;
          // in-progress polls and interactive confirmations stay put
          if (n.hasAttribute('hx-get') || n.querySelector('form') || n.querySelector('input[type="checkbox"]')) return;
          n.dataset.toastScheduled = '1';
          n.classList.add('toast-msg');
          var delay = (n.classList.contains('import-error') || n.classList.contains('failed')) ? 6000 : 3500;
          setTimeout(function () { dismiss(n); }, delay);
        });
      }
      document.body.addEventListener('htmx:afterSwap', schedule);
      document.body.addEventListener('htmx:oobAfterSwap', schedule);
      document.body.addEventListener('htmx:afterSwap', syncViewButtons);
      document.body.addEventListener('htmx:afterSwap', updateBulkBar);
      document.body.addEventListener('htmx:oobAfterSwap', updateBulkBar);
      document.body.addEventListener('htmx:afterSwap', applyFolderCollapse);
      document.body.addEventListener('htmx:oobAfterSwap', applyFolderCollapse);
      document.body.addEventListener('htmx:pushedIntoHistory', syncAddForm);
      window.addEventListener('popstate', syncAddForm);
      schedule();
      syncViewButtons();
      updateBulkBar();
      applyFolderCollapse();
      syncAddForm(true);
    })();
  </script>
  {% block content %}{% endblock %}
</body>
</html>
