<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}reposilo{% endblock %}</title>
  <script>
    (function () {
      try {
        var t = localStorage.getItem('rs-theme');
        if (!t) { t = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'; }
        document.documentElement.dataset.theme = t;
      } catch (e) {}
    })();
    function toggleTheme() {
      var d = document.documentElement;
      var n = d.dataset.theme === 'dark' ? 'light' : 'dark';
      d.dataset.theme = n;
      try { localStorage.setItem('rs-theme', n); } catch (e) {}
    }
    // drag-and-drop: repo cards onto sidebar folders
    function dragRepo(ev) {
      ev.dataTransfer.setData('text/reposilo-rel', ev.currentTarget.dataset.rel);
      ev.dataTransfer.effectAllowed = 'move';
    }
    function dragOverFolder(ev) {
      ev.preventDefault();
      ev.currentTarget.classList.add('dragover');
    }
    function dragLeaveFolder(ev) {
      ev.currentTarget.classList.remove('dragover');
    }
    function dropRepo(ev) {
      ev.preventDefault();
      ev.currentTarget.classList.remove('dragover');
      var rel = ev.dataTransfer.getData('text/reposilo-rel');
      if (!rel) return;
      htmx.ajax('POST', '/repos/move', {
        target: '#toast',
        swap: 'innerHTML',
        values: { rel: rel, folder: ev.currentTarget.dataset.folder || '' }
      });
    }
  </script>
  <link rel="stylesheet" href="/assets/style.css">
  <script src="/assets/htmx.min.js" defer></script>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/"><svg class="icon brand-icon" viewBox="0 0 16 16"><path d="M2 2h12v3H2z"/><rect x="2" y="7" width="12" height="3"/><path d="M2 12h12v2H2z"/><path d="M7 3h2v1H7zM7 8h2v1H7z"/></svg> <b>reposilo</b></a>
    <div class="topbar-actions">
      <details class="add-menu">
        <summary>&#xFF0B; Add repo</summary>
        <div class="add-panel">
          <form hx-post="/repos/add" hx-target="#add-result" hx-swap="innerHTML">
            <input name="url" type="url" placeholder="https://github.com/owner/repo.git" required>
            <input name="tags" placeholder="tags, comma separated (optional)">
            <input name="folder" list="add-folder-list" placeholder="folder (optional, e.g. tools/rust/cli)">
            <datalist id="add-folder-list" hx-get="/folders/options" hx-trigger="load" hx-target="this" hx-swap="innerHTML"></datalist>
            <button type="submit">Archive</button>
          </form>
          <div id="add-result"></div>
        </div>
      </details>
      <button class="theme-toggle" onclick="toggleTheme()" title="toggle theme" aria-label="toggle theme">
        <svg class="icon" viewBox="0 0 16 16"><circle cx="8" cy="8" r="6"/><path d="M8 2a6 6 0 0 0 0 12Z" fill="currentColor" stroke="none"/></svg>
      </button>
      <a class="icon-btn" id="bell" href="/notifications" title="notifications">
        <svg class="icon" viewBox="0 0 16 16"><path d="M8 1a4.5 4.5 0 0 0-4.5 4.5c0 4-1.5 5.5-1.5 5.5h12s-1.5-1.5-1.5-5.5A4.5 4.5 0 0 0 8 1Z"/><path d="M6.5 13.5a1.5 1.5 0 0 0 3 0"/></svg>
        <span class="bell-count" id="bell-count" hx-get="/api/bell" hx-trigger="load, every 60s" hx-swap="innerHTML"></span>
      </a>
      <a class="icon-btn" href="/settings" title="Settings" aria-label="Settings">
        <svg class="icon" viewBox="0 0 16 16"><path d="M1.5 4h13M1.5 8h13M1.5 12h13"/><circle cx="5" cy="4" r="2"/><circle cx="11" cy="8" r="2"/><circle cx="6" cy="12" r="2"/></svg>
      </a>
    </div>
  </header>
  <div id="toast"></div>
  {% block content %}{% endblock %}
</body>
</html>
