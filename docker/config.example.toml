# Copy to docker/config.toml before `docker compose up`.
# The app does not terminate TLS; run a reverse proxy in front and publish
# this port on the host loopback only.

[server]
# The container sets REPOSILO_BIND=0.0.0.0:8765, which overrides this.
# Change it with `-e REPOSILO_BIND=...` or `serve --bind ...`.
bind = "0.0.0.0:8765"

[archive]
root = "/archive"
format = "zip"

[retention]
keep_branch_snapshots = 1
keep_releases = 1

[scheduler]
enabled = true
default_interval_days = 7
release_poll_hours = 24
dead_after_days = 21

[git]
depth = 1
timeout_secs = 600

[remote]
# Space outbound requests per host and honor the server's backoff signals.
# Applies to API calls and git operations (clone, fetch, ls-remote).
enabled = true
min_interval_ms = 500
jitter_ms = 250
respect_rate_limits = true
max_wait_secs = 30
max_cooldown_secs = 900

[cache]
# Revalidate API responses with ETag / If-None-Match (a 304 is free on GitHub).
conditional = true

[verify]
# Scheduled integrity checks of every stored zip. Off by default.
enabled = false
interval_days = 7

# Download release binaries for the platforms you want. Empty = none.
[releases]
platforms = ["darwin-arm64", "linux-x64"]
# max_asset_mb = 0

# Automatically adopt forge-suggested tags (e.g. GitHub topics) in addition
# to any tags you pass at add time.
[tags]
take_suggested = false

[github]
# token = "env:GITHUB_TOKEN"
