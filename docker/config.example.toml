# reposilo configuration. Every key is listed here with its default (or an
# example) and a short comment.
#
# Docker: copy this to docker/config.toml, then `docker compose up`.
# Native: `reposilo init --root /path/to/archive` writes a config to
# ~/.config/reposilo/config.toml (override the path with --config).

[server]
# The container sets REPOSILO_BIND=0.0.0.0:8765, which overrides this.
# Change it with `-e REPOSILO_BIND=...` or `serve --bind ...`.
bind = "127.0.0.1:8765"

[archive]
root = "/archive"
# "zip" (default, universally unzip-able) or "tar.zst" (better compression).
format = "zip"
# zstd level for tar.zst snapshots (1-22).
zstd_level = 10

[ui]
# Tint cards, panels and notification markers with each repo's own color.
# Set false to give every card the same theme color.
color = true

[retention]
# Newest N default-branch snapshots and releases to keep. -1 keeps everything.
keep_branch_snapshots = 1
keep_releases = 1
# Per-tag overrides: the first rule whose tag matches a repo overrides the
# global defaults above. Manifest-level overrides still win.
# [[retention.tag_rules]]
# tag = "cli"
# keep_branch_snapshots = -1
# keep_releases = -1

[scheduler]
# Whether the background scheduler runs while serving.
enabled = true
# Default automatic check interval for branches and releases.
default_interval_days = 7
# Archive immediately when a repo is added.
run_on_add = true
# How often (seconds) the scheduler loop looks for due repos.
poll_every_secs = 900
# Max concurrent background refreshes.
max_concurrent = 2
# Consecutive days a remote may be unreachable before it is marked dead and
# the scheduler stops checking it. 0 = never declare dead.
dead_after_days = 21

[git]
# Fetch depth. 1 = shallow (default). 0 = full mirror clone.
depth = 1
# Extra args passed to `git clone`.
extra_args = []
# Hard timeout (seconds) for each git subprocess.
timeout_secs = 600

[remote]
# Space outbound requests per host so a burst of repos does not trip a forge's
# rate limiter. Applies to API calls and git operations (clone, fetch,
# ls-remote). Local and file:// remotes are never paced.
enabled = true
# Minimum gap between requests to the same host, in milliseconds.
min_interval_ms = 500
# Extra random 0..N ms, to avoid lockstep bursts.
jitter_ms = 250
# Honor Retry-After and rate-limit-reset headers.
respect_rate_limits = true
# Never block longer than this for a paused host; skip and retry later.
max_wait_secs = 30
# Cap on a single rate-limit cooldown.
max_cooldown_secs = 900

[cache]
# Revalidate API responses with ETag / If-None-Match (a 304 is free on GitHub).
conditional = true

[verify]
# Scheduled integrity checks of every stored zip. Off by default because a
# check reads the whole archive.
enabled = false
interval_days = 7

[releases]
# Also download the binary assets attached to releases, for these platforms.
# Empty = none. Each entry is a full slug ("linux-x64"), an OS ("linux"), an
# arch ("arm64") or "all"; "win64" == "windows-x64".
platforms = []
# Skip any single asset larger than this many MiB (0 = no limit).
max_asset_mb = 0

[tags]
# Adopt forge-suggested tags (GitHub topics, etc.) automatically.
take_suggested = false
# Split the folder a repo is placed in into tags (games/tools -> games, tools).
folders = false

[notifications]
# Optional webhook, POSTed on new releases and dead remotes.
# webhook_url = "https://hooks.example.com/your-hook"
# Drop alerts older than this many days. 0 keeps everything. Notifications are
# alerts; long-term history lives in Stats and OTLP.
keep_days = 14

[github]
# Token for API enrichment and suggestions; supports "env:VAR" indirection.
# token = "env:GITHUB_TOKEN"
# Legacy icon key. Prefer [icons] enabled.
fetch_avatars = true

[gitlab]
# token = "env:GITLAB_TOKEN"

[forgejo]
# token = "env:FORGEJO_TOKEN"

[icons]
# Download the repo owner's avatar (GitHub, GitLab, Forgejo) as the repo icon.
enabled = true

[llm]
# Any OpenAI-compatible endpoint (llama.cpp, Ollama, and similar). Used for
# auto-tagging and import review.
enabled = false
url = "http://127.0.0.1:8080/v1"
# Optional model name passed through to the server.
# model = "Qwen3.6-27B-GGUF"
# Repos per chat-completion request.
batch_size = 10
# Cap on tags merged per repo.
max_tags = 5
# Disable Qwen-style thinking mode (avoids thousands of hidden tokens on CPU).
disable_thinking = false
# Per-request timeout (seconds).
request_timeout_secs = 600

[otel]
# Optional OTLP/HTTP export. The built-in Stats page always works without it.
enabled = false
endpoint = "http://localhost:4318"
service_name = "reposilo"
# Metrics export interval (seconds).
interval_secs = 60
# Bridge tracing logs to OTLP.
logs = true
# Export archive metrics.
metrics = true
# Export spans (HTTP requests, add/refresh/verify jobs).
traces = true
